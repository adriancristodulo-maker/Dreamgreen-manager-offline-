<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#124b34"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" type="image/png" href="favicon.png"><title>Dream Green Manager Offline</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#18392c;background:#f4f7f4}*{box-sizing:border-box}html,body{width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}body{margin:0;touch-action:pan-y}button,input,select,textarea{touch-action:manipulation}input,select,textarea{font-size:16px}header{background:#124b34;color:white;padding:18px 16px 12px}header h1{font-size:20px;margin:0}header small{color:#cde7d5}nav{display:flex;gap:5px;overflow-x:auto;background:#e3eee7;padding:9px;position:sticky;top:0;z-index:5}nav button{white-space:nowrap;background:transparent;color:#22563a;padding:9px;border:0;border-radius:9px;font-size:13px;font-weight:700}nav button.active{background:#176b45;color:white}main{width:100%;max-width:900px;min-width:0;margin:auto;padding:15px 12px 80px;overflow-x:hidden}.card{background:white;border:1px solid #dce7df;border-radius:14px;padding:15px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{font-size:23px;font-weight:750;overflow-wrap:anywhere}.muted,small{color:#65776c}h2{font-size:20px;margin:4px 0 15px}h3{font-size:16px;margin:4px 0 12px}label{display:block;font-size:13px;font-weight:650;margin:10px 0 4px}input,select,textarea{width:100%;border:1px solid #b7cbbd;border-radius:9px;padding:11px;font:inherit;background:white}textarea{min-height:65px}button,.btn{cursor:pointer;background:#176b45;border:0;color:white;padding:11px 14px;border-radius:9px;font-weight:650;font:inherit}button.secondary{background:#e5eee7;color:#225b3d}button.danger{background:#a73737}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.item{border-top:1px solid #e3ebe5;padding:12px 0}.item:first-child{border:0}.item a{color:#176b45;font-weight:700;text-decoration:none}.pill{font-size:12px;background:#e4f0e8;padding:3px 7px;border-radius:20px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 4px;text-align:left;border-bottom:1px solid #e5ee /* Theme selector and iPhone-friendly dark palette */

</style><script>
(function(){const KEY="dg-theme-preference";function apply(){let mode=localStorage.getItem(KEY)||"auto";let dark=mode==="dark"||(mode==="auto"&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",dark?"dark":"light");document.querySelector('meta[name="theme-color"]').content=dark?"#000000":"#124b34";let control=document.getElementById("theme-select");if(control)control.value=mode}window.dgSetTheme=function(mode){localStorage.setItem(KEY,mode);apply()};apply();window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",apply);document.addEventListener("DOMContentLoaded",apply)})();
</script></head><body><header><div class="brand"><h1><img src="icon.png" alt="" style="width:27px;height:27px;object-fit:contain;vertical-align:middle;margin-right:6px">Dream Green Manager</h1><small>Versiune offline · Date pe acest dispozitiv</small></div><select id="theme-select" class="theme-picker" aria-label="Temă aplicație" onchange="dgSetTheme(this.value)"><option value="auto">◐ Auto</option><option value="light">☀ Luminos</option><option value="dark">☾ Dark</option></select></header><nav id="nav"></nav><main id="app"></main><script src="app.js"></script></body></html>
